<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Video Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#player{width:100vw;height:100vh}
.toolbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;padding:8px 12px;background:rgba(0,0,0,0.8);gap:8px;flex-wrap:wrap}
.toolbar .title{color:#fff;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:80px}
.btn{padding:6px 14px;border-radius:6px;font-size:13px;border:none;cursor:pointer;color:#fff;white-space:nowrap}
.btn-red{background:#ef4444}
.btn-gray{background:#333}
.btn.active{background:#22c55e}
.ep-panel{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(0,0,0,0.92);padding:12px;max-height:40vh;overflow-y:auto;display:none}
.ep-panel.show{display:block}
.ep-panel .section{color:#22c55e;font-size:14px;font-weight:bold;margin:8px 0}
.ep-grid{display:flex;flex-wrap:wrap;gap:8px}
.ep-tag{padding:8px 16px;border-radius:6px;font-size:13px;color:#ccc;background:#222;cursor:pointer}
.ep-tag.current{background:#22c55e;color:#fff}
.status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:18px;z-index:200;display:none}
.status.show{display:block}
</style>
<script src="./hls.min.js"></script>
<script src="./artplayer.js"></script>
</head>
<body>

<div id="player"></div>

<div class="toolbar" id="toolbar">
  <span class="title" id="vidTitle">Loading...</span>
  <button class="btn btn-red" onclick="closePlayer()">←退出</button>
  <button class="btn btn-gray" onclick="toggleEp()">📋选集</button>
</div>

<div class="ep-panel" id="epPanel">
  <div id="epContent"></div>
</div>

<div class="status show" id="status">加载中...</div>

<script>
var art = null, blockAd = true
var episodes = [], curIdx = 0
var storedUrl = '', storedTitle = '', storedPoster = ''

function getParam(name) { return (new URL(location.href)).searchParams.get(name) || '' }

function init() {
  storedUrl = getParam('url')
  storedTitle = decodeURIComponent(getParam('title') || '')
  storedPoster = decodeURIComponent(getParam('poster') || '')
  document.getElementById('vidTitle').textContent = storedTitle || 'Video Player'

  var epData = getParam('eps')
  if (epData) {
    try {
      var eps = JSON.parse(decodeURIComponent(epData))
      if (eps.u && eps.t) {
        for (var i = 0; i < eps.u.length; i++) {
          episodes.push({ url: eps.u[i], title: eps.t[i] || ('第'+(i+1)+'集') })
        }
      }
    } catch(e) {}
  }

  if (!storedUrl && episodes.length === 0) {
    document.getElementById('status').textContent = '无效播放地址'
    return
  }
  createPlayer(storedUrl || episodes[0].url, storedTitle, storedPoster)
}

var CustomLoader = (function() {
  var Base = Hls.DefaultConfig.loader
  function C(cfg) { Base.call(this, cfg); var load = this.load.bind(this)
    this.load = function(ctx, cfg, cb) {
      if (ctx.type === 'manifest' || ctx.type === 'level') {
        var onSuccess = cb.onSuccess
        cb.onSuccess = function(res, stats, ctx) {
          if (res.data && typeof res.data === 'string')
            res.data = res.data.split('\n').filter(function(l) { return l.indexOf('#EXT-X-DISCONTINUITY') === -1 }).join('\n')
          return onSuccess(res, stats, ctx, null)
        }
      }
      load(ctx, cfg, cb)
    }
  }; C.prototype = Object.create(Base.prototype); C.prototype.constructor = C; return C
})()

function createPlayer(url, title, poster) {
  document.getElementById('status').classList.add('show')
  art = new Artplayer({
    container: '#player', url: url, title: title, poster: poster,
    autoplay: true, autoSize: true, autoMini: true, loop: false, flip: false,
    playbackRate: true, aspectRatio: true, setting: true, hotkey: true,
    pip: true, mutex: true, fullscreen: true, fullscreenWeb: true,
    subtitleOffset: true, miniProgressBar: true, playsInline: true,
    lock: true, fastForward: true, autoPlayback: true,
    theme: '#22c55e', lang: 'zh-cn',
    moreVideoAttr: { crossOrigin: 'anonymous' },
    settings: [{
      html: '去广告',
      icon: '<text x="50%" y="50%" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">AD</text>',
      tooltip: blockAd ? '已开启' : '已关闭',
      onClick: function() {
        blockAd = !blockAd
        if (art && storedUrl) {
          var el = document.getElementById('player')
          while (el.firstChild) el.removeChild(el.firstChild)
          if (art.video && art.video.hls) art.video.hls.destroy()
          try { art.destroy(false) } catch(e) {}
          art = null
          setTimeout(function() { createPlayer(storedUrl, storedTitle, storedPoster) }, 200)
        }
        return blockAd ? '已开启' : '已关闭'
      }
    }],
    customType: { m3u8: function(video, url) {
      if (video.hls) video.hls.destroy()
      var hls = new Hls({
        debug: false, enableWorker: true, lowLatencyMode: true,
        maxBufferLength: 30, backBufferLength: 30, maxBufferSize: 60*1000*1000,
        loader: blockAd ? CustomLoader : Hls.DefaultConfig.loader
      })
      hls.loadSource(url); hls.attachMedia(video); video.hls = hls
      hls.on(Hls.Events.ERROR, function(e, d) {
        if (d.fatal) {
          switch (d.type) {
            case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break
            case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break
            default: hls.destroy(); break
          }
        }
      })
    }}
  })
  art.on('ready', function() { document.getElementById('status').classList.remove('show') })
  art.on('error', function() { document.getElementById('status').textContent = '播放错误' })
}

function toggleEp() { document.getElementById('epPanel').classList.toggle('show') }

function closePlayer() {
  try { uni.postMessage({ data: { close: true } }) } catch(e) {}
  history.back()
}

init()
</script>
</body>
</html>
