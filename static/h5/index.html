<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Video Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#player{width:100vw;height:100vh}
/* Toolbar */
.toolbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;padding:8px 12px;background:rgba(0,0,0,0.8);gap:8px;flex-wrap:wrap}
.toolbar .title{color:#fff;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:80px}
.btn{padding:6px 14px;border-radius:6px;font-size:13px;border:none;cursor:pointer;color:#fff;white-space:nowrap}
.btn-green{background:#22c55e}
.btn-red{background:#ef4444}
.btn-blue{background:#3b82f6}
.btn-gray{background:#333}
.btn.active{background:#22c55e}
/* Episode panel */
.ep-panel{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(0,0,0,0.92);padding:12px;max-height:40vh;overflow-y:auto;display:none}
.ep-panel.show{display:block}
.ep-panel .section{color:#22c55e;font-size:14px;font-weight:bold;margin:8px 0}
.ep-grid{display:flex;flex-wrap:wrap;gap:8px}
.ep-tag{padding:8px 16px;border-radius:6px;font-size:13px;color:#ccc;background:#222;cursor:pointer}
.ep-tag.current{background:#22c55e;color:#fff}
.status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:18px;z-index:200;display:none}
.status.show{display:block}
</style>
</head>
<body>

<div id="player"></div>

<div class="toolbar" id="toolbar">
  <span class="title" id="vidTitle">Loading...</span>
  <button class="btn btn-red" onclick="closePlayer()">←退出</button>
  <button class="btn btn-gray" id="adBtn" onclick="toggleAd()">AD:ON</button>
  <button class="btn btn-gray" onclick="toggleEp()">📋选集</button>
</div>

<div class="ep-panel" id="epPanel">
  <div id="epContent"></div>
</div>

<div class="status" id="status">加载中...</div>

<script src="hls.min.js"></script>
<script src="artplayer.js"></script>

<script>
// --- Ad Filter ---
class CustomLoader extends Hls.DefaultConfig.loader {
  constructor(cfg) { super(cfg); const load = this.load.bind(this)
    this.load = (ctx, cfg, cb) => {
      if (ctx.type === 'manifest' || ctx.type === 'level') {
        const onSuccess = cb.onSuccess
        cb.onSuccess = (res, stats, ctx) => {
          if (res.data && typeof res.data === 'string') {
            res.data = res.data.split('\n').filter(l => !l.includes('#EXT-X-DISCONTINUITY')).join('\n')
          }
          return onSuccess(res, stats, ctx, null)
        }
      }
      load(ctx, cfg, cb)
    }
  }
}

let art = null, blockAd = true
let episodes = [], curIdx = 0
let storedUrl = '', storedTitle = '', storedPoster = ''

// --- Init ---
function getParam(name) {
  const url = new URL(location.href)
  return url.searchParams.get(name) || ''
}

function init() {
  storedUrl = getParam('url')
  storedTitle = decodeURIComponent(getParam('title') || '')
  storedPoster = decodeURIComponent(getParam('poster') || '')
  const epData = getParam('eps')

  document.getElementById('vidTitle').textContent = storedTitle || 'Video Player'

  if (epData) {
    try {
      const allSources = JSON.parse(decodeURIComponent(epData))
      const srcKey = getParam('src') || 'main'
      const src = allSources[srcKey] || allSources[Object.keys(allSources)[0]]
      if (src) { episodes = src.urls; src.titles.forEach((t, i) => {
        if (!episodes[i]) episodes[i] = { url: '', title: t }
        else episodes[i] = { url: episodes[i], title: t || ('第' + (i + 1) + '集') }
      })}
    } catch(e) {}
  }

  if (!storedUrl && episodes.length === 0) {
    document.getElementById('status').textContent = '无效播放地址'
    document.getElementById('status').classList.add('show')
    return
  }

  const playUrl = storedUrl || (episodes[0] && episodes[0].url) || ''

  createPlayer(playUrl, storedTitle, storedPoster)
}

function createPlayer(url, title, poster) {
  document.getElementById('status').classList.add('show')

  art = new Artplayer({
    container: '#player',
    url: url,
    title: title,
    poster: poster,
    autoplay: true,
    autoSize: true,
    autoMini: true,
    loop: false,
    flip: false,
    playbackRate: true,
    aspectRatio: true,
    setting: true,
    hotkey: true,
    pip: true,
    mutex: true,
    fullscreen: true,
    fullscreenWeb: true,
    subtitleOffset: true,
    miniProgressBar: true,
    playsInline: true,
    lock: true,
    fastForward: true,
    autoPlayback: true,
    theme: '#22c55e',
    lang: 'zh-cn',
    moreVideoAttr: { crossOrigin: 'anonymous' },
    customType: {
      m3u8: function (video, url) {
        if (video.hls) video.hls.destroy()
        const hls = new Hls({
          debug: false,
          enableWorker: true,
          lowLatencyMode: true,
          maxBufferLength: 30,
          backBufferLength: 30,
          maxBufferSize: 60 * 1000 * 1000,
          loader: blockAd ? CustomLoader : Hls.DefaultConfig.loader
        })
        hls.loadSource(url)
        hls.attachMedia(video)
        video.hls = hls
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break
              case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break
              default: hls.destroy(); break
            }
          }
        })
      }
    }
  })

  art.on('ready', () => {
    document.getElementById('status').classList.remove('show')
  })

  art.on('error', (err) => {
    document.getElementById('status').textContent = '播放错误'
  })

  buildEpisodes()
}

// --- Episodes ---
function buildEpisodes() {
  if (episodes.length <= 1) return
  const html = episodes.map((ep, i) =>
    `<span class="ep-tag ${i === curIdx ? 'current' : ''}" onclick="switchEp(${i})">${ep.title || ('第' + (i + 1) + '集')}</span>`
  ).join('')
  document.getElementById('epContent').innerHTML = '<div class="section">选集</div><div class="ep-grid">' + html + '</div>'
}

function toggleEp() {
  document.getElementById('epPanel').classList.toggle('show')
}

function switchEp(i) {
  if (i === curIdx) return
  curIdx = i
  const ep = episodes[i]
  if (ep && ep.url && art) {
    art.switchUrl(ep.url)
    buildEpisodes()
  }
  toggleEp()
}

// --- Ad Toggle ---
function toggleAd() {
  blockAd = !blockAd
  document.getElementById('adBtn').textContent = 'AD:' + (blockAd ? 'ON' : 'OFF')
  document.getElementById('adBtn').className = blockAd ? 'btn btn-gray' : 'btn btn-red'
  if (art && storedUrl) {
    const target = document.getElementById('player')
    if (target) {
      while (target.firstChild) target.removeChild(target.firstChild)
    }
    if (art.video && art.video.hls) {
      art.video.hls.destroy()
    }
    try { art.destroy(false) } catch(e) {}
    art = null
    setTimeout(() => createPlayer(storedUrl, storedTitle, storedPoster), 300)
  }
}

function closePlayer() {
  // #ifdef APP-PLUS
  uni.postMessage({ data: 'close' })
  // #endif
  try { window.close() } catch(e) {}
  history.back()
}

init()
</script>
</body>
</html>
